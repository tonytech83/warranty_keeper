{% if is_paginated %}
<nav class="pager" aria-label="Pagination">
  {% if page_obj.has_previous %}
  <a class="pager-link pager-prev" href="{% querystring page=page_obj.previous_page_number %}">‹ Prev</a>
  {% else %}
  <span class="pager-link pager-prev pager-disabled">‹ Prev</span>
  {% endif %}

  {% for num in paginator.page_range %}
  {% if num == page_obj.number %}
  <span class="pager-link pager-current">{{ num }}</span>
  {% else %}
  <a class="pager-link" href="{% querystring page=num %}">{{ num }}</a>
  {% endif %}
  {% endfor %}

  {% if page_obj.has_next %}
  <a class="pager-link pager-next" href="{% querystring page=page_obj.next_page_number %}">Next ›</a>
  {% else %}
  <span class="pager-link pager-next pager-disabled">Next ›</span>
  {% endif %}
</nav>
{% endif %}
